[project]
name = "rag-szkolenia"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "fastembed-haystack>=2.7.0",
    "haystack-ai>=3.1.0",
    "langfuse-haystack>=5.2.0",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pydantic-settings>=2.15.0",
    "qdrant-haystack>=10.6.0",
    "sentence-transformers>=6.0.1",
    "sentence-transformers-haystack>=0.1.1",
    "torch>=2.13",
    "uvicorn>=0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
sources = ["src"]
only-include = ["src/agents", "src/api.py", "src/cli.py", "src/settings.py"]


[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
